<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토트넘 상황판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <h1>토트넘 상황판</h1>

    <!-- 카드 3개를 한 곳에 모아 둡니다. -->
    <section class="card-list">
      <article class="card">
        <h2>현재 스쿼드</h2>
        <p>핵심 선수들의 컨디션을 간단히 확인합니다.</p>
      </article>

      <article class="card">
        <h2>이적 루머</h2>
        <p>오늘 나온 이적 소식을 한 줄로 정리합니다.</p>
      </article>

      <article class="card">
        <h2>JJ 메모</h2>
        <p id="jjMemo">프로토타입 화면을 먼저 완성합니다.</p>
      </article>
    </section>

    <button id="memoButton" type="button">JJ 메모 바꾸기</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
